
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'for_astronaut_mobile/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev \
            libssl-dev automake gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install buildozer Cython==0.29.34

      - name: Build Android APK
        working-directory: for_astronaut_mobile
        run: |
          yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: for-astronaut-apk
          path: for_astronaut_mobile/bin/*.apk
          if-no-files-found: error
          retention-days: 7
